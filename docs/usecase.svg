  <text x="900" y="430" text-anchor="middle" font-size="14" font-weight="700">Desk</text>
  <text x="36" y="530" font-size="13" fill="#5c675f">The reporter files, views, and filters. Filing includes a reference id. The desk views, filters, and changes status.</text>
