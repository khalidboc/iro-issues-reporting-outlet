<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Arial, sans-serif">
  <rect width="1100" height="640" fill="#f4efe6"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1f4d3a">Ishikawa — why issues around AAUA stay unresolved</text>
  <text x="40" y="74" font-size="14" fill="#5c675f">CSC426 IRO. Effect is on the right. Open docs/ishikawa.drawio in draw.io to edit.</text>
  <line x1="80" y1="330" x2="860" y2="330" stroke="#1c241f" stroke-width="3"/>
  <rect x="870" y="280" width="190" height="100" rx="12" fill="#1f4d3a"/>
  <text x="965" y="322" text-anchor="middle" fill="#f4efe6" font-size="16">Effect</text>
  <text x="965" y="348" text-anchor="middle" fill="#f4efe6" font-size="13">Reported late,</text>
  <text x="965" y="366" text-anchor="middle" fill="#f4efe6" font-size="13">or not at all</text>
  <g font-size="15" font-weight="700" fill="#c45c26">
    <text x="80" y="160">People</text>
    <text x="300" y="160">Process</text>
    <text x="540" y="160">Information</text>
    <text x="80" y="470">Place</text>
    <text x="300" y="470">Tools</text>
    <text x="540" y="470">Trust</text>
  </g>
  <g font-size="14" fill="#1c241f">
    <text x="80" y="188">Students and indigenes use different channels</text>
    <text x="80" y="210">Fear of being named. No owner of a case</text>
    <text x="300" y="188">Complaints die in WhatsApp</text>
    <text x="300" y="210">No status. Offices send people away</text>
    <text x="540" y="188">No shared categories or reference number</text>
    <text x="540" y="210">Place is described vaguely</text>
    <text x="80" y="498">Hostels versus town roads</text>
    <text x="80" y="520">Flooded paths, dark corridors, dry borehole</text>
    <text x="300" y="498">No simple public form. Paper gets lost</text>
    <text x="300" y="520">Data cost blocks long forms</text>
    <text x="540" y="498">Nothing visible changes</text>
    <text x="540" y="520">Sensitive reports feel unsafe, so people stop</text>
  </g>
</svg>
